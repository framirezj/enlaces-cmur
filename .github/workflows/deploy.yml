name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_DIR: /opt/docker/cesfam-enlaces/frontend
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

    steps:
      - name: Actualizar código
        working-directory: ${{ env.APP_DIR }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${{ github.token }}" fetch origin main
          git reset --hard origin/main

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Construir imagen
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose build

      - name: Levantar aplicación
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose up -d

      - name: Verificar contenedor
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose ps
