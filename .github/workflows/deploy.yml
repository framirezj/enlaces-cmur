name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_DIR: /opt/docker/cesfam-enlaces/frontend
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

    steps:
      - name: Actualizar código
        working-directory: ${{ env.APP_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin main
          git reset --hard origin/main

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Construir imagen
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose build --no-cache

      - name: Levantar aplicación
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose up -d

      - name: Verificar contenedor
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose ps
